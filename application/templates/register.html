{% extends "base_layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-3">Create Account</h3>
                <form method="post" action="/register">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label for="display_name" class="form-label">Display Name (optional)</label>
                        <input id="display_name" name="display_name" type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" name="email" type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" name="password" type="password" class="form-control" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
                {% if google_login_enabled %}
                <div class="my-3 text-center text-muted small">or</div>
                <a href="/login/google" class="btn btn-outline-dark w-100">Continue with Google</a>
                {% endif %}
                <p class="mt-3 mb-0 text-muted">
                    Already have an account? <a href="/login">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
