{% extends "base_layout.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2>Edit Workout Session</h2>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <input type="hidden" id="workout_identifier" value="{{ workout.identifier }}">
                
                <form id="workout_update_form">
                    <div class="mb-4">
                        <h5>Workout Details</h5>
                        <div class="mb-3">
                            <label for="target_muscle_groups" class="form-label">Target Muscle Groups</label>
                            <input type="text" class="form-control" id="target_muscle_groups" 
                                value="{{ workout.target_muscle_groups | join(', ') }}" required>
                        </div>
                    </div>

                    <div id="exercises_container">
                        {% for exercise in workout.exercises %}
                        <div class="exercise-block border rounded p-3 mb-3 bg-light">
                            <div class="mb-3">
                                <label class="form-label">Exercise Selection</label>
                                <select class="form-select exercise-selection-input" 
                                        data-selected-id="{{ exercise.exercise_definition_identifier }}" required>
                                </select>
                            </div>
                            
                            <h6>Sets</h6>
                            <div class="sets-container">
                                {% for set in exercise.sets %}
                                <div class="row mb-2 set-row">
                                    <div class="col">
                                        <input type="number" class="form-control weight-input" value="{{ set.weight_in_kilograms }}" step="0.5" required>
                                    </div>
                                    <div class="col">
                                        <input type="number" class="form-control repetitions-input" value="{{ set.repetitions }}" required>
                                    </div>
                                    <div class="col">
                                        <input type="number" class="form-control exertion-input" value="{{ set.rate_of_perceived_exertion }}" min="1" max="10" required>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-secondary mt-2 add-set-button">Add Another Set</button>
                        </div>
                        {% endfor %}
                    </div>

                    <button type="button" class="btn btn-outline-primary mb-4" id="add_exercise_button">Add Another Exercise</button>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Update Workout Session</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block javascript_scripts %}
<script src="{{ url_for('static', filename='javascript/workout_update.js') }}"></script>
{% endblock %}
